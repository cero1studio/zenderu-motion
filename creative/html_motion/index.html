<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenderu HTML Motion Studio (9:16 Video Mockups)</title>
  <style>
    :root {
      --bg: #070514;
      --surface: #120e2e;
      --brand: #252151;
      --mint: #62d177;
      --text: #f3f0ff;
      --muted: #8b85b2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Outfit", sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 24px 40px;
      background: var(--surface);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; }
    .brand-title span { color: var(--mint); }

    .nav-tabs { display: flex; gap: 12px; }
    .tab-btn {
      background: rgba(37, 33, 81, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover, .tab-btn.active {
      background: var(--mint);
      color: #070514;
      border-color: var(--mint);
      box-shadow: 0 0 15px rgba(98, 209, 119, 0.4);
    }

    .main-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .phone-mockup {
      width: 420px;
      height: 746px; /* 9:16 aspect ratio */
      border: 12px solid #201a47;
      border-radius: 52px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(98, 209, 119, 0.15);
      position: relative;
      background: #000;
    }

    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 24px;
      background: #201a47;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 100;
    }

    iframe {
      width: 1080px;
      height: 1920px;
      border: none;
      transform: scale(0.366666);
      transform-origin: top left;
      pointer-events: auto;
    }

    .controls-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 14, 46, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 200;
    }

    .control-action {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .control-action:hover { border-color: var(--mint); color: var(--mint); }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      ZENDERU <span>// HTML MOTION STUDIO</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="loadTemplate('templates/chat_consultation.html', this)">Chat en Tiempo Real</button>
      <button class="tab-btn" onclick="loadTemplate('templates/call_interface.html', this)">Llamada en Vivo</button>
      <button class="tab-btn" onclick="loadTemplate('templates/epiphany_quote.html', this)">Cita Epifanía Anselmo</button>
    </div>
  </header>

  <main class="main-viewport">
    <div class="phone-mockup">
      <div class="phone-notch"></div>
      <iframe id="preview-frame" src="templates/chat_consultation.html"></iframe>
    </div>
  </main>

  <div class="controls-panel">
    <button class="control-action" onclick="reloadFrame()">↻ Reiniciar Animación</button>
    <button class="control-action" onclick="openFullscreen()">⛶ Pantalla Completa (1080x1920)</button>
  </div>

  <script>
    const frame = document.getElementById('preview-frame');

    function loadTemplate(url, btn) {
      frame.src = url;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function reloadFrame() {
      const src = frame.src;
      frame.src = '';
      setTimeout(() => { frame.src = src; }, 50);
    }

    function openFullscreen() {
      window.open(frame.src, '_blank');
    }
  </script>
</body>
</html>
