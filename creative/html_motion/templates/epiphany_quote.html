<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Zenderu Epiphany Quote - 9:16 Broadcast Mockup</title>
  <style>
    :root {
      --bg-dark: #06011a;
      --brand-purple: #252151;
      --brand-mint: #62d177;
      --mint-glow: rgba(98, 209, 119, 0.5);
      --text-main: #f5f2ff;
      --text-muted: #958ebf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Outfit", "SF Pro Display", sans-serif;
    }

    body {
      width: 1080px;
      height: 1920px;
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 50%, #1e1647 0%, #06011a 75%);
      color: var(--text-main);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 80px;
      position: relative;
    }

    /* Ambient Canvas for Subtle Particle Motion */
    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Outer Container */
    .quote-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 50px;
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(37, 33, 81, 0.7);
      border: 1px solid rgba(98, 209, 119, 0.3);
      padding: 16px 36px;
      border-radius: 999px;
      font-size: 24px;
      font-weight: 600;
      color: var(--brand-mint);
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .quote-body {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -1.5px;
      max-width: 960px;
    }

    .highlight {
      color: var(--brand-mint);
      text-shadow: 0 0 35px var(--mint-glow);
      position: relative;
      display: inline-block;
    }

    .author-card {
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(18, 14, 46, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px 40px;
      border-radius: 999px;
      margin-top: 40px;
      backdrop-filter: blur(20px);
    }

    .author-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--brand-mint);
      background: #252151 url('../assets/branding/guide_hero.webp') center/cover;
    }

    .author-meta {
      text-align: left;
    }

    .author-meta h3 {
      font-size: 28px;
      font-weight: 700;
    }

    .author-meta p {
      font-size: 20px;
      color: var(--brand-mint);
      margin-top: 4px;
    }

    /* Bottom Micro CTA */
    .cta-hint {
      position: absolute;
      bottom: 120px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--text-muted);
      font-size: 24px;
      animation: floatHint 2s infinite ease-in-out;
    }

    @keyframes floatHint {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <canvas id="space-canvas"></canvas>

  <div class="quote-wrapper">
    <div class="top-pill">
      <span>✦</span> REENCUADRE CONSCIENTE
    </div>

    <h1 class="quote-body">
      "No necesitas más información.<br>
      Necesitas <span class="highlight">silencio operativo</span> para escuchar lo que ya sabes."
    </h1>

    <div class="author-card">
      <div class="author-avatar"></div>
      <div class="author-meta">
        <h3>Guía Anselmo</h3>
        <p>Decodificación de Patrones & Vida</p>
      </div>
    </div>
  </div>

  <div class="cta-hint">
    <span>Conversa en vivo sin intermediarios</span>
    <strong style="color: #62d177; font-size: 28px;">zenderu.com</strong>
  </div>

  <script>
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1080;
    canvas.height = 1920;

    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2 + 0.8,
      alpha: Math.random() * 0.8 + 0.2,
      speed: Math.random() * 0.3 + 0.1
    }));

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        s.y -= s.speed;
        if (s.y < 0) s.y = canvas.height;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(240, 235, 255, ${s.alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
